name: ViralSync Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      AGENCY_ENV: dev
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies and run tests
        run: |
          uv pip install -r requirements.lock
          uvx ruff check agency/backend agency/agents agency/workers agency/knowledge agency/gateway
          uvx pip-audit -r requirements.lock
          pytest --cov=agency/backend --cov-fail-under=50 agency/tests/unit

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend
        run: |
          cd agency/frontend
          npm ci
          npm run build
          npm audit

  docker-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hadolint check
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: agency/Dockerfile

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Gitleaks check
        run: |
          gitleaks detect
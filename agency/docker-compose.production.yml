version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: viralsync_backend_prod
    restart: always
    environment:
      - AGENCY_ENV=production
      - DATABASE_URL=postgresql+asyncpg://viralsync:prod_pass@postgres:5432/viralsync_db
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker_default:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: viralsync_celery_default
    restart: always
    command: celery -A workers.celery_app.celery_app worker --loglevel=info -Q default -c 4
    environment:
      - AGENCY_ENV=production
      - DATABASE_URL=postgresql+asyncpg://viralsync:prod_pass@postgres:5432/viralsync_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - postgres

  celery_worker_rendering:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: viralsync_celery_rendering
    restart: always
    command: celery -A workers.celery_app.celery_app worker --loglevel=info -Q rendering -c 2
    environment:
      - AGENCY_ENV=production
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  celery_worker_webhooks:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: viralsync_celery_webhooks
    restart: always
    command: celery -A workers.celery_app.celery_app worker --loglevel=info -Q webhooks -c 2
    environment:
      - AGENCY_ENV=production
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: viralsync_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: viralsync
      POSTGRES_PASSWORD: prod_pass
      POSTGRES_DB: viralsync_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viralsync -d viralsync_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: viralsync_redis_prod
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5



services:
  postgres:
    image: postgres:16
    container_name: viralsync_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agency}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agency}
      POSTGRES_DB: ${POSTGRES_DB:-agency}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agency}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: viralsync_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant
    container_name: viralsync_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage
    restart: unless-stopped
    # health-honesty (REQ-PH-04): /readyz returns 200 only when storage is
    # ready; qdrant/qdrant (debian:13-slim) ships bash but no curl/wget/nc,
    # so the probe uses the bash /dev/tcp builtin.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '200' <&3"]
      interval: 5s
      timeout: 5s
      retries: 5

  searxng:
    image: searxng/searxng
    container_name: viralsync_searxng
    ports:
      - "8080:8080"
    volumes:
      - ./searxng-settings:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080
      - SEARXNG_SECRET=${SEARXNG_SECRET:-viralsync_searxng_secret_key_123}

    restart: unless-stopped

  ollama:
    image: ollama/ollama
    container_name: viralsync_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    restart: unless-stopped
    # Solo estrictamente necesario cuando AGENCY_ENV=dev

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: viralsync_litellm
    ports:
      - "4000:4000"
    volumes:
      - ./gateway:/app/config
    command: ["--config", "/app/config/litellm_config.${AGENCY_ENV:-dev}.yaml"]
    # env_file apunta al .env en la raíz del workspace (un nivel arriba de agency/).
    # Si no existe, copiar: cp .env.example ../.env && editar valores.
    env_file:
      - path: ../.env
        required: false
    restart: unless-stopped
    depends_on:
      - ollama

  backend:
    build:
      context: ..
      dockerfile: agency/Dockerfile
    container_name: viralsync_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://agency:agency@postgres:5432/agency
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=qdrant:6333
      - AGENCY_ENV=${AGENCY_ENV:-dev}
      # Honest list fix (storage-honesty PR #1, D-6): dentro de compose el backend
      # debe apuntar a MinIO por el host del servicio, no a localhost (el default
      # fabricaba listados con URLs self-referenciales rotas).
      - MINIO_ENDPOINT=minio:9000
    env_file:
      - path: ../.env
        required: false
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started

  celery_worker:
    build:
      context: ..
      dockerfile: agency/Dockerfile
    container_name: viralsync_celery_worker
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=1 -Q rendering,webhooks,default
    environment:
      - DATABASE_URL=postgresql+asyncpg://agency:agency@postgres:5432/agency
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=qdrant:6333
      - MINIO_ENDPOINT=minio:9000
      - AGENCY_ENV=${AGENCY_ENV:-dev}

    volumes:
      - ./backend:/app/backend
      - ./agents:/app/agents
      - ./workers:/app/workers
    env_file:
      - path: ../.env
        required: false

    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  minio:
    image: minio/minio
    container_name: viralsync_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  video_renderer:
    build: ./microservices/renderer
    container_name: viralsync_video_renderer
    ports:
      - "8001:8001"
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-viralsync-media}
      - PEXELS_API_KEY=${PEXELS_API_KEY:-}
    depends_on:
      - minio

  video_publisher:
    build: ./microservices/publisher
    container_name: viralsync_video_publisher
    ports:
      - "8002:8002"
    environment:
      - AGENCY_ENV=${AGENCY_ENV:-dev}
    env_file:
      - path: ../.env
        required: false
    restart: unless-stopped

  pg_backup:
    image: postgres:16
    container_name: viralsync_pg_backup
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-agency}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agency}
      POSTGRES_DB: ${POSTGRES_DB:-agency}
      BACKUP_DIR: /backups
    volumes:
      - ./scripts/backup_postgres.sh:/backup_postgres.sh:ro
      - pgbackupdata:/backups
    entrypoint: ["/bin/sh", "-c", "chmod +x /backup_postgres.sh && while true; do /backup_postgres.sh; sleep 86400; done"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  qdrantdata:
  ollamadata:
  miniodata:
  pgbackupdata:


version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agency
      POSTGRES_PASSWORD: agency
      POSTGRES_DB: agency
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  searxng:
    image: searxng/searxng
    ports:
      - "8080:8080"
    volumes:
      - ./searxng-settings:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    # solo estrictamente necesario cuando AGENCY_ENV=dev

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    ports:
      - "4000:4000"
    volumes:
      - ./gateway:/app/config
    command: ["--config", "/app/config/litellm_config.${AGENCY_ENV:-dev}.yaml"]
    env_file: .env
    depends_on:
      - ollama

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - postgres
      - redis
      - litellm
      - qdrant

  celery_worker:
    build: ./backend
    # concurrency=1 es obligatorio en dev — ver regla de concurrencia,
    # AGENTS.md sección 8 (4 núcleos / 16GB de referencia local)
    command: celery -A worker worker --loglevel=info --concurrency=1
    env_file: .env
    depends_on:
      - redis
      - postgres

volumes:
  pgdata:
  qdrantdata:
  ollamadata:

# litellm_config.dev.yaml
# AGENCY_ENV=dev — Pool de free tiers reales sin Ollama local requerido.
# Estrategia: Gemini 2.5 Flash primario (1M tokens/día gratis).
# Fallback automático en 429/503 → Groq → GitHub Models → OpenRouter → Ollama.
#
# Setup: Copiar .env.example a .env y llenar al menos una API key.

model_list:
  # ── Primario ─────────────────────────────────────────────────────── #
  - model_name: motor-agencia
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: "os.environ/GEMINI_API_KEY"

  # ── Fallbacks Free Tier ──────────────────────────────────────────── #
  - model_name: motor-agencia-groq
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: "os.environ/GROQ_API_KEY"

  - model_name: motor-agencia-github
    litellm_params:
      model: github/gpt-4o-mini
      api_key: "os.environ/GITHUB_MODELS_TOKEN"
      api_base: "https://models.inference.ai.azure.com"

  - model_name: motor-agencia-openrouter
    litellm_params:
      model: openrouter/google/gemini-flash-1.5-8b
      api_key: "os.environ/OPENROUTER_API_KEY"

  # ── Fallback Local (OPCIONAL — requiere Ollama corriendo) ────────── #
  - model_name: motor-agencia-ollama
    litellm_params:
      model: ollama/llama3.2
      api_base: "os.environ/OLLAMA_BASE_URL"

router_settings:
  routing_strategy: "usage-based-routing-v2"
  num_retries: 3
  cooldown_time: 30
  allowed_fails: 1
  fallbacks:
    - motor-agencia:
        - motor-agencia-groq
        - motor-agencia-github
        - motor-agencia-openrouter
        - motor-agencia-ollama

general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"

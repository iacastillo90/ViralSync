# litellm_config.dev.yaml
# AGENCY_ENV=dev — Pool de free tiers con alta cuota (500 RPD).
# Estrategia: Gemini 3.5 Flash Lite (500 RPD) -> Gemini 3.1 Flash Lite (500 RPD) -> Gemini 3.5 Flash -> Groq -> OpenRouter -> Ollama.

model_list:
  # ── Primarios con Cuota Alta en Google AI Studio (Gemini 2.0 & 1.5) ─── #
  - model_name: gemini-flash-20
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: "os.environ/GEMINI_API_KEY"

  - model_name: gemini-flash-15
    litellm_params:
      model: gemini/gemini-1.5-flash
      api_key: "os.environ/GEMINI_API_KEY"

  - model_name: motor-agencia
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: "os.environ/GEMINI_API_KEY"

  # ── Secundarios (Gemini 1.5 Flash 8B & Gemini 1.5 Pro) ──────────────── #
  - model_name: gemini-flash-8b
    litellm_params:
      model: gemini/gemini-1.5-flash-8b
      api_key: "os.environ/GEMINI_API_KEY"

  - model_name: gemini-pro-15
    litellm_params:
      model: gemini/gemini-1.5-pro
      api_key: "os.environ/GEMINI_API_KEY"

  # ── Fallbacks Ultra-Rápidos con Cuota Alta en Groq (14,400 RPD) ─── #
  - model_name: motor-agencia-groq
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: "os.environ/GROQ_API_KEY"

  - model_name: motor-agencia-groq-instant
    litellm_params:
      model: groq/llama-3.1-8b-instant
      api_key: "os.environ/GROQ_API_KEY"

  - model_name: motor-agencia-openrouter
    litellm_params:
      model: openrouter/openrouter/free
      api_key: "os.environ/OPENROUTER_API_KEY"

  # ── Fallback Local (Offline) ──────────────────────────────────────── #
  - model_name: motor-agencia-ollama
    litellm_params:
      model: ollama/llama3.2
      api_base: "os.environ/OLLAMA_BASE_URL"

router_settings:
  routing_strategy: "usage-based-routing-v2"
  num_retries: 4
  cooldown_time: 30
  allowed_fails: 1
  fallbacks:
    - motor-agencia:
        - gemini-flash-lite-31
        - gemini-flash-35
        - gemini-flash-36
        - motor-agencia-groq
        - motor-agencia-groq-instant
        - motor-agencia-openrouter
        - motor-agencia-ollama
    - gemini-flash-lite-35:
        - gemini-flash-lite-31
        - gemini-flash-35
        - motor-agencia-groq
        - motor-agencia-openrouter

general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"

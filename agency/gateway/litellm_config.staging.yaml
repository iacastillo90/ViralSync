# litellm_config.staging.yaml
# AGENCY_ENV=staging — pool free-tier REAL, NUNCA el proveedor pagado.
# Objetivo: validar rate limits, timeouts y fallback real entre proveedores
# gratuitos con 3-5 clientes piloto (ver AGENTS.md sección 12, Beta cerrada).

model_list:
  - model_name: motor-agencia
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: "os.environ/GROQ_API_KEY"

  - model_name: motor-agencia
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: "os.environ/GEMINI_API_KEY"

  - model_name: motor-agencia
    litellm_params:
      model: github/gpt-4o
      api_key: "os.environ/GITHUB_MODELS_TOKEN"

  - model_name: motor-agencia
    litellm_params:
      model: cerebras/llama3.1-8b
      api_key: "os.environ/CEREBRAS_API_KEY"

  - model_name: motor-agencia
    litellm_params:
      model: sambanova/Meta-Llama-3.1-405B-Instruct
      api_key: "os.environ/SAMBANOVA_API_KEY"

  - model_name: motor-agencia
    litellm_params:
      model: openrouter/auto
      api_key: "os.environ/OPENROUTER_API_KEY"

  # último respaldo infalible dentro del propio pool gratuito
  - model_name: motor-agencia
    litellm_params:
      model: ollama/qwen2.5-coder:7b
      api_base: "os.environ/OLLAMA_BASE_URL"

router_settings:
  routing_strategy: "least-busy"
  num_retries: 3
  cooldown_time: 300
  allowed_fails: 2

general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  # virtual keys + budget por tenant se generan por script de onboarding,
  # no se hardcodean aquí — ver backend/onboarding.py (pendiente)

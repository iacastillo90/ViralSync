# litellm_config.staging.yaml
# AGENCY_ENV=staging — pool free-tier REAL con estrategia explícita de Fallback en 429.

model_list:
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: "os.environ/GEMINI_API_KEY"

  - model_name: groq-llama
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: "os.environ/GROQ_API_KEY"

  - model_name: openrouter-free
    litellm_params:
      model: openrouter/openrouter/free
      api_key: "os.environ/OPENROUTER_API_KEY"

  - model_name: ollama-local
    litellm_params:
      model: ollama/qwen2.5-coder:7b
      api_base: "os.environ/OLLAMA_BASE_URL"

  - model_name: motor-agencia
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: "os.environ/GEMINI_API_KEY"

router_settings:
  routing_strategy: "usage-based-routing-v2"
  num_retries: 3
  cooldown_time: 60
  allowed_fails: 1
  fallbacks:
    - gemini-flash: ["groq-llama", "openrouter-free", "ollama-local"]
    - groq-llama: ["gemini-flash", "openrouter-free"]
    - motor-agencia: ["groq-llama", "gemini-flash", "openrouter-free"]

litellm_settings:
  cache: true
  cache_type: redis

general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"

# litellm_config.production.yaml
# AGENCY_ENV=production — Pool gratuito con fallback pagado único a Claude Haiku ante errores 429.

model_list:
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: "os.environ/GEMINI_API_KEY"

  - model_name: groq-llama
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: "os.environ/GROQ_API_KEY"

  - model_name: motor-agencia
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: "os.environ/GROQ_API_KEY"

  # --- único fallback pagado ---
  - model_name: fallback-pagado
    litellm_params:
      model: claude-3-haiku-20240307
      api_key: "os.environ/PAID_API_KEY"

router_settings:
  routing_strategy: "least-busy"
  num_retries: 3
  cooldown_time: 60
  allowed_fails: 1
  fallbacks:
    - gemini-flash: ["groq-llama", "fallback-pagado"]
    - groq-llama: ["gemini-flash", "fallback-pagado"]
    - motor-agencia: ["fallback-pagado"]

litellm_settings:
  callbacks: ["prometheus"]
  track_cost_per_user: true

general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"

